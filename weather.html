<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" type="text/css" href="weather.css">
    <style>
        .we, .err {
            display: none;
        }
        .err { 
            display: flex;
            flex-direction: column;
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cont">
            <h1 style="color:white" class="head">Get Weather Details</h1>
            <div class="search">
            
                <input type="text" placeholder="Enter City Name" class="search_value">
                <img src="search.png" class="search_icon">
            </div>
           
            <p class="err">Invalid City Name</p>
          
            <div class="we">
                <div class="weather">
                    <img src="drizzle.png" class="weather_icon">
                    <h1 class="weather_temperature" style="color:white;">22°C</h1>
                    <h1 class="City" style="color:white;">New York</h1>
                </div>
                <div class="details">
                    <div class="detail-item">
                        <img src="humidity.png" class="icon" width="30px">
                        <div class="text">
                            <p class="humiper">50%</p>
                            <p>Humidity</p>
                        </div>
                    </div>
                    <div class="detail-item">
                        <img src="wind.png" class="icon" width="30px">
                        <div class="text">
                            <p class="windval">15 km/h</p>
                            <p>Wind</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="weather.js"></script>
</body>
</html>
